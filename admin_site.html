<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель — База видео</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #2d2d2d; padding-bottom: 15px; }
        h1 { color: #bb86fc; margin: 0; }
        .stats { background: #1e1e1e; padding: 15px 25px; border-radius: 8px; border: 1px solid #2d2d2d; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #2d2d2d; }
        th { background: #252525; color: #bb86fc; font-weight: 600; }
        tr:hover { background: #252525; }
        video { width: 100px; border-radius: 4px; }
        .btn { padding: 8px 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-copy { background: #03dac6; color: #121212; }
        .btn-copy:hover { background: #018786; }
        .btn-del { background: #cf6679; color: #121212; margin-left: 5px; }
        .btn-del:hover { background: #b00020; }
        .back-link { color: #bb86fc; text-decoration: none; display: inline-block; margin-bottom: 15px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← На главную загрузку</a>
        <header>
            <h1>Управление базой видео</h1>
            <div class="stats" id="total-count">Всего видео: {{ videos|length }}</div>
        </header>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Превью</th>
                    <th>Название</th>
                    <th>Категория</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for v in videos %}
                <tr id="row-{{ v[0] }}">
                    <td><code>{{ v[0] }}</code></td>
                    <td>
                        {% if v[4] %}
                        <video src="{{ v[4] }}" muted onmouseover="this.play()" onmouseout="this.pause();this.currentTime=0;"></video>
                        {% else %}
                        <span>Telegram ID</span>
                        {% endif %}
                    </td>
                    <td><strong>{{ v[1] }}</strong></td>
                    <td>{{ v[2] }}</td>
                    <td>
                        <button class="btn btn-copy" onclick="copyId('{{ v[0] }}')">Скопировать ID</button>
                        <button class="btn btn-del" onclick="deleteVideo('{{ v[0] }}')">Удалить</button>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" style="text-align: center; color: #777;">База данных пока пуста</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>
        function copyId(id) {
            navigator.clipboard.writeText(id).then(() => {
                alert('ID видео (' + id + ') скопирован в буфер обмена!');
            });
        }

        function deleteVideo(id) {
            if(confirm('Точно удалить это видео из базы?')) {
                fetch('/api/delete/' + id, { method: 'POST' })
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            document.getElementById('row-' + id).remove();
                            location.reload();
                        }
                    });
            }
        }
    </script>
</body>
</html>
