<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеобаза | Каталог роликов</title>
    <!-- Подключаем шрифты и иконки FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f111a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(26, 29, 41, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: #8a8a8a;
            font-size: 0.9rem;
        }

        .bot-banner {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.1), rgba(79, 172, 254, 0.1));
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .bot-banner a {
            display: inline-block;
            margin-top: 10px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #000;
            padding: 8px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .bot-banner a:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .section-title {
            font-size: 1.1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Список видео */
        .video-list-container {
            max-height: 400px;
            overflow-y: auto;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #555;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-play-circle"></i> Видеобекенд Каталог</h1>
            <p>Вся база роликов, доступная в нашем Telegram боте</p>
        </header>

        <!-- Рекламный блок для перехода в бота -->
        <div class="bot-banner">
            <p style="font-size: 0.9rem; color: #ccc;">Хотите смотреть видео в Telegram, искать по названию или скачивать?</p>
            <a href="https://t.me/randomvideohub_bot" target="_blank"><i class="fa-brands fa-telegram"></i> Открыть Telegram-бот</a>
        </div>

        <!-- БЛОК ТОП-5 ПОПУЛЯРНЫХ ВИДЕО -->
        <div style="margin-bottom: 25px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 15px;">
            <h3 class="section-title" style="color: #ff5e62;">
                <i class="fa-solid fa-fire"></i> Топ-5 популярных видео
            </h3>
            <div id="top-videos-list">
                <!-- TOP_VIDEOS_PLACEHOLDER -->
            </div>
        </div>

        <!-- ОБЩИЙ СПИСОК ВИДЕО -->
        <div>
            <h3 class="section-title" style="color: #00f2fe;">
                <i class="fa-solid fa-list"></i> Все видео в базе
            </h3>
            <div class="video-list-container">
                <!-- VIDEO_LIST_PLACEHOLDER -->
            </div>
        </div>

        <footer>
            &copy; 2026 Видеобекенд Бот. Все права защищены.
        </footer>
    </div>

</body>
</html>
